[build]
builder = "RAILPACK"
buildCommand = "corepack enable && corepack prepare pnpm@10.5.0 --activate && pnpm install --frozen-lockfile && pnpm build:web"

[deploy]
startCommand = "pnpm start:web"
healthcheckPath = "/health/live"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
