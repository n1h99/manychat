services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: omnicus
      POSTGRES_PASSWORD: omnicus
      POSTGRES_USER: omnicus
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U omnicus -d omnicus']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
