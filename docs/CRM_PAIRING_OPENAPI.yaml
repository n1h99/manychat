openapi: 3.1.0
info:
  title: Omnicus CRM pairing API
  version: 1.0.0
  description: >
    One-time exchange that binds one external CRM tenant to one Omnicus
    project. An Omnicus project administrator creates the short-lived pairing
    code and the CRM backend consumes it directly.
servers:
  - url: https://api.example.com
paths:
  /api/v1/projects/{projectId}/crm-config/pairing:
    post:
      summary: Create a single-use pairing code
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartPairingRequest'
      responses:
        '201':
          description: Pairing code created
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    $ref: '#/components/schemas/StartPairingResponse'
                  meta:
                    type: object
                    additionalProperties: true
        '401':
          description: Authentication required
        '403':
          description: integrations:manage permission required
  /integrations/v1/crm/pair:
    post:
      summary: Consume a pairing code and exchange scoped credentials
      description: >
        The code is single-use and expires after ten minutes. Both service
        credentials are accepted or returned exactly once. Read endpoints never
        expose them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompletePairingRequest'
      responses:
        '200':
          description: Pairing completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompletePairingResponse'
        '404':
          description: Pairing code is invalid, expired, consumed, or mismatched
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    StartPairingRequest:
      type: object
      additionalProperties: false
      required: [crmProjectId]
      properties:
        crmProjectId:
          type: string
          minLength: 1
          maxLength: 160
    StartPairingResponse:
      type: object
      additionalProperties: false
      required: [expiresAt, omnicusApiUrl, pairingCode]
      properties:
        expiresAt:
          type: string
          format: date-time
        omnicusApiUrl:
          type: string
          format: uri
        pairingCode:
          type: string
          writeOnly: true
          description: Single-use code shown only in this response.
    CompletePairingRequest:
      type: object
      additionalProperties: false
      required: [pairingCode, crmBaseUrl, crmProjectId, crmInboundAuthToken]
      properties:
        pairingCode:
          type: string
          writeOnly: true
          minLength: 20
          maxLength: 256
        crmBaseUrl:
          type: string
          format: uri
          description: Exact HTTPS origin outside development and test.
        crmProjectId:
          type: string
          minLength: 1
          maxLength: 160
        crmInboundAuthToken:
          type: string
          writeOnly: true
          minLength: 32
          maxLength: 512
        capabilities:
          type: object
          additionalProperties: true
    CompletePairingResponse:
      type: object
      additionalProperties: false
      required: [crmProjectId, omnicusInboundAuthToken, omnicusProjectId, status]
      properties:
        crmProjectId:
          type: string
        omnicusInboundAuthToken:
          type: string
          writeOnly: true
          description: Project-scoped credential returned exactly once.
        omnicusProjectId:
          type: string
          format: uuid
        status:
          type: string
          enum: [ACTIVE]
